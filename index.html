<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>俄罗斯方块</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="俄罗斯方块">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
body {
  background: #1a1a2e;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  display: flex; flex-direction: column;
  align-items: center;
  height: 100dvh; height: 100vh;
}

/* ---- Top Info Bar ---- */
.info-bar {
  display: flex; justify-content: center; align-items: center;
  gap: 16px; padding: 6px 10px; width: 100%; max-width: 500px;
  background: #16213e; border-bottom: 2px solid #0f3460;
  flex-shrink: 0;
}
.info-item { text-align: center; }
.info-item .label { font-size: 11px; color: #888; }
.info-item .value { font-size: 22px; font-weight: bold; color: #fff; line-height: 1.2; }
.info-item .value.highlight { color: #e94560; }

/* ---- Game Area ---- */
.game-wrapper {
  flex: 1; display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 4px;
  overflow: hidden;
}
canvas#board {
  border: 2px solid #0f3460; border-radius: 4px;
  box-shadow: 0 0 20px rgba(83,52,131,0.4);
  display: block;
}

/* ---- Touch Controls ---- */
.controls {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding: 6px 8px 10px; width: 100%; max-width: 500px;
  flex-shrink: 0;
}
.ctrl-row { display: flex; gap: 10px; justify-content: center; }
.ctrl-btn {
  width: 64px; height: 52px;
  border: none; border-radius: 12px;
  background: #16213e;
  color: #ccc;
  font-size: 26px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.ctrl-btn:active { background: #0f3460; }
.ctrl-btn.wide { width: 140px; font-size: 20px; }
.ctrl-btn.accent { background: #e94560; color: #fff; }
.ctrl-btn.accent:active { background: #c23152; }
.ctrl-btn.small-text { font-size: 14px; font-weight: bold; }

/* ---- Start overlay ---- */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
}
.overlay h2 { color: #e94560; font-size: 36px; margin-bottom: 10px; }
.overlay p { color: #ccc; font-size: 16px; margin-bottom: 16px; }
.overlay button {
  padding: 12px 40px; font-size: 18px; font-weight: bold;
  background: #e94560; color: #fff; border: none; border-radius: 8px;
  cursor: pointer; letter-spacing: 2px;
}
.overlay button:active { background: #c23152; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="info-bar">
  <div class="info-item"><div class="label">分数</div><div class="value" id="score">0</div></div>
  <div class="info-item"><div class="label">行数</div><div class="value" id="lines">0</div></div>
  <div class="info-item"><div class="label">等级</div><div class="value" id="level">1</div></div>
  <div class="info-item"><div class="label">下一个</div><canvas id="next" width="80" height="80"></canvas></div>
</div>

<!-- Game Board -->
<div class="game-wrapper">
  <canvas id="board"></canvas>
</div>

<!-- Touch Controls -->
<div class="controls">
  <div class="ctrl-row">
    <button class="ctrl-btn" id="btnLeft" title="左移">◀</button>
    <button class="ctrl-btn" id="btnRotate" title="旋转">🔄</button>
    <button class="ctrl-btn" id="btnRight" title="右移">▶</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn wide" id="btnDown" title="软降">▼ 加速</button>
    <button class="ctrl-btn wide accent" id="btnDrop" title="硬降">⏬ 直落</button>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn small-text" id="btnPause" title="暂停">暂停</button>
    <button class="ctrl-btn small-text" id="btnStart" title="开始">开始</button>
  </div>
</div>

<!-- Start Overlay -->
<div class="overlay" id="overlay">
  <h2>俄罗斯方块</h2>
  <p>点击下方开始游戏</p>
  <button id="overlayBtn">开始游戏</button>
</div>

<script>
// ---- Responsive sizing ----
const COLS = 10, ROWS = 20;
let BLOCK = 30;
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCanvas = document.getElementById('next');
const nextCtx = nextCanvas.getContext('2d');

function resizeBoard() {
  const maxH = window.innerHeight * 0.58;
  const maxW = window.innerWidth * 0.85;
  BLOCK = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
  if (BLOCK < 16) BLOCK = 16;
  if (BLOCK > 36) BLOCK = 36;
  board.width = BLOCK * COLS;
  board.height = BLOCK * ROWS;
  // Also scale next canvas
  const ns = Math.floor(BLOCK * 0.65);
  nextCanvas.width = ns * 5;
  nextCanvas.height = ns * 5;
}
window.addEventListener('resize', resizeBoard);
window.addEventListener('orientationchange', () => setTimeout(resizeBoard, 300));
resizeBoard();

// ---- Tetromino definitions ----
const PIECES = [
  { shape: [[1,1,1,1]], color: '#00f0f0' },
  { shape: [[1,1],[1,1]], color: '#f0f000' },
  { shape: [[0,1,0],[1,1,1]], color: '#a000f0' },
  { shape: [[0,1,1],[1,1,0]], color: '#00f000' },
  { shape: [[1,1,0],[0,1,1]], color: '#f00000' },
  { shape: [[1,0,0],[1,1,1]], color: '#0000f0' },
  { shape: [[0,0,1],[1,1,1]], color: '#f0a000' },
];

// ---- Game State ----
let grid = [], currentPiece = null, nextPiece = null;
let currentX = 0, currentY = 0;
let score = 0, lines = 0, level = 1;
let gameRunning = false, gamePaused = false, gameOver = false;
let dropInterval = 800, lastDrop = 0, animationId = null;

function createGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) grid[r] = new Array(COLS).fill(null);
}

function randomPiece() {
  return JSON.parse(JSON.stringify(PIECES[Math.floor(Math.random() * PIECES.length)]));
}

function spawnPiece() {
  if (!nextPiece) { currentPiece = randomPiece(); nextPiece = randomPiece(); }
  else { currentPiece = nextPiece; nextPiece = randomPiece(); }
  currentX = Math.floor((COLS - currentPiece.shape[0].length) / 2);
  currentY = 0;
  if (collision(currentPiece.shape, currentX, currentY)) {
    gameRunning = false; gameOver = true;
  }
}

function collision(shape, offX, offY) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const x = offX + c, y = offY + r;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y < 0) continue;
      if (grid[y][x] !== null) return true;
    }
  return false;
}

function lockPiece() {
  for (let r = 0; r < currentPiece.shape.length; r++)
    for (let c = 0; c < currentPiece.shape[r].length; c++) {
      if (!currentPiece.shape[r][c]) continue;
      const x = currentX + c, y = currentY + r;
      if (y < 0) continue;
      grid[y][x] = currentPiece.color;
    }
  clearLines(); spawnPiece();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(cell => cell !== null)) {
      grid.splice(r, 1); grid.unshift(new Array(COLS).fill(null));
      cleared++; r++;
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];
    score += points[cleared] * level; lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(50, 800 - (level - 1) * 70);
    updateDisplay();
  }
}

function movePiece(dx, dy) {
  if (!collision(currentPiece.shape, currentX + dx, currentY + dy)) {
    currentX += dx; currentY += dy; return true;
  }
  if (dy === 1) lockPiece();
  return false;
}

function rotatePiece() {
  const shape = currentPiece.shape;
  const rotated = shape[0].map((_, i) => shape.map(row => row[i]).reverse());
  for (const dx of [0, -1, 1, -2, 2]) {
    if (!collision(rotated, currentX + dx, currentY)) {
      currentPiece.shape = rotated; currentX += dx; return;
    }
  }
}

function hardDrop() {
  let dy = 0;
  while (!collision(currentPiece.shape, currentX, currentY + dy + 1)) dy++;
  currentY += dy; score += dy * 2;
  lockPiece(); updateDisplay();
}

// ---- Rendering ----
function drawBlock(context, x, y, color, size) {
  context.fillStyle = color; context.fillRect(x, y, size, size);
  context.fillStyle = 'rgba(255,255,255,0.2)';
  context.fillRect(x, y, size, 3); context.fillRect(x, y, 3, size);
  context.fillStyle = 'rgba(0,0,0,0.25)';
  context.fillRect(x, y + size - 3, size, 3);
  context.fillRect(x + size - 3, y, 3, size);
  context.strokeStyle = 'rgba(0,0,0,0.12)';
  context.lineWidth = 1;
  context.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
}

function drawBoard() {
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, 0, board.width, board.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (grid[r][c]) drawBlock(ctx, c * BLOCK, r * BLOCK, grid[r][c], BLOCK);
  if (currentPiece && gameRunning && !gameOver) {
    let ghostY = currentY;
    while (!collision(currentPiece.shape, currentX, ghostY + 1)) ghostY++;
    if (ghostY !== currentY) {
      for (let r = 0; r < currentPiece.shape.length; r++)
        for (let c = 0; c < currentPiece.shape[r].length; c++)
          if (currentPiece.shape[r][c]) {
            ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
            ctx.strokeRect((currentX + c) * BLOCK + 2, (ghostY + r) * BLOCK + 2, BLOCK - 4, BLOCK - 4);
          }
    }
    for (let r = 0; r < currentPiece.shape.length; r++)
      for (let c = 0; c < currentPiece.shape[r].length; c++)
        if (currentPiece.shape[r][c]) {
          const yy = currentY + r;
          if (yy >= 0) drawBlock(ctx, (currentX + c) * BLOCK, yy * BLOCK, currentPiece.color, BLOCK);
        }
  }
}

function drawNext() {
  const ns = nextCanvas.width / 5;
  nextCtx.fillStyle = '#16213e'; nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  const s = nextPiece.shape, c = nextPiece.color;
  const ox = (nextCanvas.width - s[0].length * ns) / 2;
  const oy = (nextCanvas.height - s.length * ns) / 2;
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c]) drawBlock(nextCtx, ox + c * ns, oy + r * ns, c, ns);
}

function updateDisplay() {
  document.getElementById('score').textContent = score;
  document.getElementById('lines').textContent = lines;
  document.getElementById('level').textContent = level;
}

function showOverlay(show) {
  document.getElementById('overlay').classList.toggle('hidden', !show);
}

// ---- Game Loop ----
function gameLoop(timestamp) {
  if (!gameRunning || gameOver) {
    drawBoard(); drawNext();
    if (gameOver) { showOverlay(true); document.getElementById('overlayBtn').textContent = '重新开始'; }
    return;
  }
  if (!gamePaused && timestamp - lastDrop > dropInterval) {
    movePiece(0, 1); lastDrop = timestamp;
  }
  drawBoard(); drawNext();
  animationId = requestAnimationFrame(gameLoop);
}

// ---- Keyboard Controls (still works on desktop) ----
document.addEventListener('keydown', e => {
  if (!gameRunning || gameOver) {
    if (e.code === 'Enter' || e.code === 'Space') startGame();
    return;
  }
  if (e.code === 'KeyP') { gamePaused = !gamePaused; if (!gamePaused) lastDrop = performance.now(); return; }
  if (gamePaused) return;
  switch (e.code) {
    case 'ArrowLeft': e.preventDefault(); movePiece(-1, 0); break;
    case 'ArrowRight': e.preventDefault(); movePiece(1, 0); break;
    case 'ArrowDown': e.preventDefault(); if (movePiece(0, 1)) score += 1; updateDisplay(); break;
    case 'ArrowUp': e.preventDefault(); rotatePiece(); break;
    case 'Space': e.preventDefault(); hardDrop(); break;
  }
});

// ---- Touch Controls ----
function addTouch(id, action) {
  const btn = document.getElementById(id);
  btn.addEventListener('pointerdown', e => { e.preventDefault(); if (!gameRunning || gameOver || gamePaused) return; action(); });
  // Repeat for held buttons
  if (id === 'btnLeft' || id === 'btnRight' || id === 'btnDown') {
    let holdTimer;
    btn.addEventListener('pointerdown', e => {
      if (!gameRunning || gameOver || gamePaused) return;
      holdTimer = setInterval(() => action(), 60);
    });
    btn.addEventListener('pointerup', () => clearInterval(holdTimer));
    btn.addEventListener('pointerleave', () => clearInterval(holdTimer));
    btn.addEventListener('pointercancel', () => clearInterval(holdTimer));
  }
}

addTouch('btnLeft', () => movePiece(-1, 0));
addTouch('btnRight', () => movePiece(1, 0));
addTouch('btnDown', () => { if (movePiece(0, 1)) { score += 1; updateDisplay(); } });
addTouch('btnRotate', () => rotatePiece());
addTouch('btnDrop', () => hardDrop());

document.getElementById('btnPause').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!gameRunning || gameOver) return;
  gamePaused = !gamePaused;
  if (!gamePaused) lastDrop = performance.now();
  document.getElementById('btnPause').textContent = gamePaused ? '继续' : '暂停';
});

document.getElementById('btnStart').addEventListener('pointerdown', e => { e.preventDefault(); startGame(); });
document.getElementById('overlayBtn').addEventListener('pointerdown', e => { e.preventDefault(); startGame(); });

// ---- Start / Restart ----
function startGame() {
  createGrid(); currentPiece = null; nextPiece = null;
  score = 0; lines = 0; level = 1; dropInterval = 800;
  gameRunning = true; gamePaused = false; gameOver = false;
  lastDrop = performance.now();
  updateDisplay(); spawnPiece();
  showOverlay(false);
  document.getElementById('btnPause').textContent = '暂停';
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

// ---- Init ----
createGrid(); updateDisplay(); drawBoard(); drawNext();
animationId = requestAnimationFrame(gameLoop);

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
